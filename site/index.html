<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indian Job Market Explorer</title>
<meta name="description" content="Interactive treemap explorer of Indian occupations — employment, pay, skills, demand, and AI exposure across 43 NCO occupation groups.">
<meta property="og:title" content="Indian Job Market Explorer">
<meta property="og:description" content="Interactive treemap of Indian occupations based on PLFS 2023-24, NCO 2015, NCS, and NSDC data. Compare employment, pay, skill levels, demand, and AI exposure.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Indian Job Market Explorer">
<meta name="twitter:description" content="Interactive treemap of 43 Indian occupation groups — 625M workers visualized by employment, pay, and AI exposure based on PLFS 2023-24.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #0d1117;
  --header-bg: #161b22;
  --text-primary: #e6edf3;
  --text-secondary: #9da5b0;
  --text-muted: #6e7681;
  --border: #30363d;
  --accent: #3fb950;
  --accent-hover: #56d364;
  --btn-bg: #21262d;
  --btn-active: #3fb950;
  --btn-active-text: #0d1117;
  --group-stroke: rgba(0,0,0,0.6);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
}

/* ── Header ── */
.header {
  background: var(--header-bg);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px 10px;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
  z-index: 10;
}

.header h1 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--text-primary);
}

.header .subtitle {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 2px;
}

/* ── Controls bar ── */
.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 24px;
  background: var(--header-bg);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
}

.controls-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-right: 4px;
}

.layer-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 16px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--btn-bg);
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}

.layer-btn:hover {
  border-color: var(--accent);
  background: #1a2e1f;
}

.layer-btn.active {
  background: var(--btn-active);
  color: var(--btn-active-text);
  border-color: var(--btn-active);
  box-shadow: 0 2px 8px rgba(63,185,80,0.35);
}

.layer-btn .icon {
  font-size: 15px;
}

/* ── Treemap container ── */
.treemap-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: #0d1117;
}

#treemap {
  width: 100%;
  height: 100%;
}

/* ── Treemap tiles ── */
.tile {
  overflow: hidden;
  cursor: pointer;
  transition: opacity 0.15s ease;
  position: absolute;
}

.tile:hover {
  opacity: 0.88;
}

.tile-inner {
  width: 100%;
  height: 100%;
  padding: 5px 6px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  overflow: hidden;
  border: 1px solid rgba(0,0,0,0.3);
  border-radius: 1px;
}

.tile-title {
  font-size: 11px;
  font-weight: 600;
  line-height: 1.25;
  color: rgba(0,0,0,0.85);
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  word-break: break-word;
  text-shadow: 0 0 4px rgba(0,0,0,0.3);
}

.tile-value {
  font-size: 10px;
  font-weight: 500;
  margin-top: 2px;
  color: rgba(0,0,0,0.65);
  text-shadow: 0 0 4px rgba(0,0,0,0.3);
}

/* Group labels */
.group-label {
  position: absolute;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: rgba(230,237,243,0.7);
  pointer-events: none;
  z-index: 5;
  padding: 3px 6px;
  background: rgba(13,17,23,0.7);
  border-radius: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Tooltip ── */
.tooltip {
  position: fixed;
  pointer-events: none;
  background: #1c2128;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 14px 16px;
  max-width: 340px;
  box-shadow: var(--shadow-lg);
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.15s ease;
  font-size: 13px;
  line-height: 1.5;
}

.tooltip.visible {
  opacity: 1;
}

.tooltip-header {
  font-weight: 700;
  font-size: 14px;
  color: var(--text-primary);
  margin-bottom: 2px;
  line-height: 1.3;
}

.tooltip-code {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 8px;
  font-family: "SF Mono", "Fira Code", "Consolas", monospace;
}

.tooltip-row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  border-bottom: 1px solid #21262d;
}

.tooltip-row:last-child {
  border-bottom: none;
}

.tooltip-label {
  color: var(--text-muted);
  font-size: 12px;
  flex-shrink: 0;
  margin-right: 12px;
}

.tooltip-val {
  font-weight: 600;
  font-size: 12px;
  text-align: right;
  color: var(--text-primary);
}

.tooltip-desc {
  margin-top: 8px;
  font-size: 11.5px;
  color: var(--text-secondary);
  line-height: 1.45;
  border-top: 1px solid #21262d;
  padding-top: 6px;
}

.tooltip-rationale {
  margin-top: 4px;
  font-size: 11px;
  color: var(--text-muted);
  font-style: italic;
}

/* ── Legend ── */
.legend-container {
  position: absolute;
  bottom: 12px;
  right: 12px;
  background: rgba(22,27,34,0.95);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow-md);
  z-index: 8;
  max-width: 260px;
  backdrop-filter: blur(6px);
  overflow: hidden;
}

.legend-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  cursor: pointer;
  user-select: none;
  border: none;
  background: transparent;
  width: 100%;
  font-family: inherit;
}

.legend-toggle:hover {
  background: rgba(0,0,0,0.03);
}

.legend-toggle-arrow {
  font-size: 10px;
  color: var(--text-muted);
  transition: transform 0.2s ease;
}

.legend-container.collapsed .legend-toggle-arrow {
  transform: rotate(180deg);
}

.legend-body {
  padding: 0 14px 10px;
  transition: max-height 0.25s ease, opacity 0.2s ease;
  max-height: 300px;
  opacity: 1;
  overflow: hidden;
}

.legend-container.collapsed .legend-body {
  max-height: 0;
  opacity: 0;
  padding-bottom: 0;
}

.legend-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.legend-bar {
  width: 100%;
  height: 14px;
  border-radius: 3px;
  margin-bottom: 4px;
}

.legend-labels {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.legend-discrete {
  display: flex;
  flex-direction: column;
  gap: 3px;
  margin-bottom: 6px;
}

.legend-discrete-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-secondary);
}

.legend-swatch {
  width: 14px;
  height: 14px;
  border-radius: 3px;
  border: 1px solid rgba(255,255,255,0.15);
  flex-shrink: 0;
}

.legend-source {
  font-size: 9.5px;
  color: var(--text-muted);
  line-height: 1.5;
  border-top: 1px solid #21262d;
  padding-top: 5px;
  margin-top: 2px;
}

/* ── Footer ── */
.footer {
  background: var(--header-bg);
  border-top: 1px solid var(--border);
  padding: 8px 24px;
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  flex-wrap: wrap;
  gap: 6px;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

/* ── Stats panel ── */
.stats-panel {
  background: var(--header-bg);
  border-bottom: 1px solid var(--border);
  padding: 10px 24px;
  flex-shrink: 0;
}

.stats-row {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}

.stat-item {
  display: flex;
  flex-direction: column;
  min-width: 100px;
}

.stat-value {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1.2;
}

.stat-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.stats-histogram {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 32px;
  margin-top: 8px;
}

.hist-bar {
  flex: 1;
  min-width: 3px;
  border-radius: 2px 2px 0 0;
  transition: height 0.3s ease;
  position: relative;
}

.hist-bar:hover {
  opacity: 0.8;
}

/* ── Loading ── */
.loading {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: var(--text-secondary);
}

.loading-spinner {
  width: 36px;
  height: 36px;
  border: 3px solid #30363d;
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 12px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ── Error ── */
.error-msg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: #c62828;
  max-width: 400px;
  padding: 20px;
}

.error-msg h3 {
  margin-bottom: 8px;
}
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div class="header">
    <h1>Indian Job Market Explorer</h1>
    <div class="subtitle">Interactive occupation treemap based on official Indian labour-market data</div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <span class="controls-label">Color by:</span>
    <button class="layer-btn" data-layer="outlook">
      <span class="icon">&#8599;</span> Outlook
    </button>
    <button class="layer-btn active" data-layer="pay">
      <span class="icon">&#8377;</span> Pay
    </button>
    <button class="layer-btn" data-layer="skill">
      <span class="icon">&#9733;</span> Education
    </button>
    <button class="layer-btn" data-layer="demand">
      <span class="icon">&#9650;</span> Demand
    </button>
    <button class="layer-btn" data-layer="ai">
      <span class="icon">&#9889;</span> AI Exposure
    </button>
  </div>

  <!-- Stats Panel -->
  <div class="stats-panel" id="stats-panel">
    <div class="stats-row">
      <div class="stat-item" id="stat-total"><span class="stat-value">—</span><span class="stat-label">Total Jobs</span></div>
      <div class="stat-item" id="stat-metric"><span class="stat-value">—</span><span class="stat-label">—</span></div>
      <div class="stat-item" id="stat-growing"><span class="stat-value">—</span><span class="stat-label">Growing</span></div>
      <div class="stat-item" id="stat-declining"><span class="stat-value">—</span><span class="stat-label">Declining</span></div>
    </div>
    <div class="stats-histogram" id="stats-histogram"></div>
  </div>

  <!-- Treemap -->
  <div class="treemap-wrap">
    <div id="treemap"></div>
    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <div>Loading occupation data...</div>
    </div>
    <div class="legend-container collapsed" id="legend"></div>
    <div class="tooltip" id="tooltip"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span>Sources: PLFS 2023-24, NCS Portal, NCO-2015 classification &bull; Inspired by <a href="https://karpathy.ai/jobs" target="_blank" rel="noopener">karpathy.ai/jobs</a></span>
    <span><a href="insights.html">Insights</a> &bull; <a href="explained.html">Explained</a> &bull; <a href="methodology.html">Methodology</a></span>
  </div>
</div>

<script>
(function() {
  "use strict";

  // ─── Indian number formatting ───
  function formatIndianNumber(n) {
    if (n == null || isNaN(n)) return "N/A";
    n = Math.round(n);
    var s = n.toString();
    var afterPoint = "";
    if (s.indexOf(".") > 0) {
      afterPoint = s.substring(s.indexOf("."), s.length);
      s = s.substring(0, s.indexOf("."));
    }
    var lastThree = s.substring(s.length - 3);
    var otherNumbers = s.substring(0, s.length - 3);
    if (otherNumbers !== "") lastThree = "," + lastThree;
    var formatted = otherNumbers.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + lastThree + afterPoint;
    return formatted;
  }

  function formatLakhCrore(n) {
    if (n == null || isNaN(n)) return "N/A";
    if (n >= 10000000) {
      return (n / 10000000).toFixed(1).replace(/\.0$/, "") + " Cr";
    } else if (n >= 100000) {
      return (n / 100000).toFixed(1).replace(/\.0$/, "") + " L";
    } else {
      return formatIndianNumber(n);
    }
  }

  function formatCurrency(n) {
    if (n == null || isNaN(n)) return "N/A";
    return "\u20B9" + formatIndianNumber(n);
  }

  function skillLabel(level) {
    var labels = {1: "Elementary", 2: "Semi-skilled", 3: "Skilled", 4: "Highly skilled"};
    return labels[level] || "N/A";
  }

  function truncate(s, len) {
    if (!s) return "";
    return s.length > len ? s.slice(0, len - 1) + "\u2026" : s;
  }

  // ─── Color scales ───
  var colorScales = {
    outlook: function(d) {
      if (d.data.growth_outlook == null) return "#ccc";
      // -15 to +32 range, 0 is neutral
      var t = Math.max(0, Math.min(1, (d.data.growth_outlook + 15) / 47));
      return d3.interpolateRdYlGn(t);
    },
    pay: function(d) {
      if (d.data.pay_median_monthly == null) return "#ccc";
      var t = Math.max(0, Math.min(1, (d.data.pay_median_monthly - 5000) / (80000 - 5000)));
      return d3.interpolateRdYlGn(t);
    },
    skill: function(d) {
      var colors = {1: "#bbdefb", 2: "#64b5f6", 3: "#7e57c2", 4: "#4a148c"};
      return colors[d.data.skill_level] || "#ccc";
    },
    demand: function(d) {
      if (d.data.demand_index == null) return "#ccc";
      var t = Math.max(0, Math.min(1, d.data.demand_index / 100));
      return d3.interpolateOrRd(t);
    },
    ai: function(d) {
      if (d.data.ai_exposure == null) return "#ccc";
      var t = Math.max(0, Math.min(1, d.data.ai_exposure / 10));
      return d3.interpolateRdYlGn(1 - t);
    }
  };

  // ─── State ───
  var currentLayer = "pay";
  var data = null;
  var root = null;

  // ─── DOM refs ───
  var treemapEl = document.getElementById("treemap");
  var tooltipEl = document.getElementById("tooltip");
  var legendEl = document.getElementById("legend");
  var loadingEl = document.getElementById("loading");

  // ─── Load data ───
  d3.json("data-india.json?v=2").then(function(raw) {
    loadingEl.style.display = "none";
    data = raw;
    buildTreemap();
    renderLegend();
    updateStats();
  }).catch(function(err) {
    loadingEl.innerHTML = '<div class="error-msg"><h3>Failed to load data</h3><p>Could not load data-india.json. Serve this folder over HTTP so the browser can fetch the data file.</p><p style="font-size:11px;color:#888;margin-top:8px;">' + err + '</p></div>';
  });

  // ─── Build hierarchy ───
  function buildHierarchy(data) {
    var groups = {};
    data.forEach(function(d) {
      var g = d.occupation_group || "Other";
      if (!groups[g]) groups[g] = [];
      groups[g].push(d);
    });

    var children = Object.keys(groups).map(function(g) {
      return {
        name: g,
        children: groups[g].map(function(occ) {
          return Object.assign({name: occ.occupation_title}, occ);
        })
      };
    });

    return {name: "root", children: children};
  }

  // ─── Render treemap ───
  function buildTreemap() {
    var rect = treemapEl.getBoundingClientRect();
    var width = rect.width;
    var height = rect.height;
    if (width < 10 || height < 10) return;

    var hierarchy = buildHierarchy(data);

    root = d3.hierarchy(hierarchy)
      .sum(function(d) { return d.employment_count || 0; })
      .sort(function(a, b) { return b.value - a.value; });

    d3.treemap()
      .size([width, height])
      .paddingTop(20)
      .paddingRight(2)
      .paddingBottom(2)
      .paddingLeft(2)
      .paddingInner(1)
      .tile(d3.treemapSquarify.ratio(1.2))
      (root);

    render(width, height);
  }

  function render(width, height) {
    treemapEl.innerHTML = "";

    var container = document.createElement("div");
    container.style.position = "relative";
    container.style.width = width + "px";
    container.style.height = height + "px";

    // Group labels
    var groups = root.children || [];
    groups.forEach(function(g) {
      var gw = g.x1 - g.x0;
      if (gw < 50) return;
      var label = document.createElement("div");
      label.className = "group-label";
      label.style.left = g.x0 + 4 + "px";
      label.style.top = g.y0 + 2 + "px";
      label.style.maxWidth = (gw - 8) + "px";
      label.textContent = g.data.name;
      container.appendChild(label);
    });

    // Leaves
    var leaves = root.leaves();
    leaves.forEach(function(leaf) {
      var lw = leaf.x1 - leaf.x0;
      var lh = leaf.y1 - leaf.y0;
      if (lw < 2 || lh < 2) return;

      var tile = document.createElement("div");
      tile.className = "tile";
      tile.style.left = leaf.x0 + "px";
      tile.style.top = leaf.y0 + "px";
      tile.style.width = lw + "px";
      tile.style.height = lh + "px";

      var color = colorScales[currentLayer](leaf);
      var inner = document.createElement("div");
      inner.className = "tile-inner";
      inner.style.background = color;

      // Determine text color based on background luminance
      var textColor = getTextColor(color);

      if (lw > 40 && lh > 22) {
        var titleEl = document.createElement("div");
        titleEl.className = "tile-title";
        titleEl.style.color = textColor;
        var maxChars = Math.floor((lw * lh) / 120);
        titleEl.textContent = truncate(leaf.data.occupation_title, Math.max(12, maxChars));

        // Adjust clamp based on available height
        var lines = Math.max(1, Math.floor((lh - 16) / 14));
        titleEl.style.webkitLineClamp = lines;
        inner.appendChild(titleEl);

        if (lh > 38 && lw > 50) {
          var valEl = document.createElement("div");
          valEl.className = "tile-value";
          valEl.style.color = textColor;
          valEl.style.opacity = "0.7";
          valEl.textContent = formatLakhCrore(leaf.data.employment_count);
          inner.appendChild(valEl);
        }
      }

      tile.appendChild(inner);
      tile.addEventListener("mouseenter", function(e) { showTooltip(e, leaf); });
      tile.addEventListener("mousemove", function(e) { moveTooltip(e); });
      tile.addEventListener("mouseleave", hideTooltip);
      container.appendChild(tile);
    });

    treemapEl.appendChild(container);
  }

  function getTextColor(bgColor) {
    // Parse color and compute luminance
    try {
      var c = d3.color(bgColor);
      if (!c) return "rgba(0,0,0,0.82)";
      var r = c.r / 255, g = c.g / 255, b = c.b / 255;
      var luminance = 0.299 * r + 0.587 * g + 0.114 * b;
      return luminance > 0.55 ? "rgba(0,0,0,0.82)" : "rgba(255,255,255,0.92)";
    } catch(e) {
      return "rgba(0,0,0,0.82)";
    }
  }

  // ─── Tooltip ───
  function showTooltip(e, leaf) {
    var d = leaf.data;
    var html = '<div class="tooltip-header">' + (d.occupation_title || "Unknown") + '</div>';
    html += '<div class="tooltip-code">NCO ' + (d.occupation_code || "N/A") + ' &bull; ' + (d.occupation_group || "") + '</div>';

    html += '<div class="tooltip-row"><span class="tooltip-label">Employment</span><span class="tooltip-val">' + formatLakhCrore(d.employment_count) + ' (' + formatIndianNumber(d.employment_count) + ')</span></div>';
    html += '<div class="tooltip-row"><span class="tooltip-label">Monthly Pay</span><span class="tooltip-val">' + formatCurrency(d.pay_median_monthly) + '</span></div>';
    var outlookColor = d.growth_outlook > 0 ? "#3fb950" : d.growth_outlook < 0 ? "#f85149" : "#9da5b0";
    html += '<div class="tooltip-row"><span class="tooltip-label">10yr Outlook</span><span class="tooltip-val" style="color:' + outlookColor + '">' + (d.growth_outlook > 0 ? '+' : '') + d.growth_outlook + '%</span></div>';
    html += '<div class="tooltip-row"><span class="tooltip-label">Skill Level</span><span class="tooltip-val">' + (d.skill_level != null ? d.skill_level + ' \u2013 ' + skillLabel(d.skill_level) : 'N/A') + '</span></div>';
    html += '<div class="tooltip-row"><span class="tooltip-label">AI Exposure</span><span class="tooltip-val">' + (d.ai_exposure != null ? d.ai_exposure + '/10' : 'N/A') + '</span></div>';
    html += '<div class="tooltip-row"><span class="tooltip-label">Demand</span><span class="tooltip-val">' + (d.demand_index != null ? d.demand_index + '/100' : 'N/A') + '</span></div>';

    if (d.ai_rationale) {
      html += '<div class="tooltip-rationale">' + truncate(d.ai_rationale, 150) + '</div>';
    }

    if (d.description) {
      html += '<div class="tooltip-desc">' + truncate(d.description, 180) + '</div>';
    }

    tooltipEl.innerHTML = html;
    tooltipEl.classList.add("visible");
    moveTooltip(e);
  }

  function moveTooltip(e) {
    var tt = tooltipEl;
    var tw = tt.offsetWidth;
    var th = tt.offsetHeight;
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var mx = e.clientX;
    var my = e.clientY;

    var x = mx + 16;
    var y = my + 16;

    if (x + tw > vw - 8) x = mx - tw - 16;
    if (y + th > vh - 8) y = my - th - 16;
    if (x < 8) x = 8;
    if (y < 8) y = 8;

    tt.style.left = x + "px";
    tt.style.top = y + "px";
  }

  function hideTooltip() {
    tooltipEl.classList.remove("visible");
  }

  // ─── Legend ───
  var legendCollapsed = true;

  function renderLegend() {
    var layerNames = {outlook: "Growth Outlook (10yr)", pay: "Pay (Monthly Average)", skill: "Skill Level (NCO)", demand: "Demand Index (NCS Proxy)", ai: "AI Exposure Score"};
    var html = "";

    html += '<button class="legend-toggle" id="legend-toggle">';
    html += '<span class="legend-title" style="margin:0;">' + layerNames[currentLayer] + '</span>';
    html += '<span class="legend-toggle-arrow">\u25BC</span>';
    html += '</button>';

    html += '<div class="legend-body">';

    if (currentLayer === "outlook") {
      html += '<canvas id="legend-bar" width="220" height="14" class="legend-bar"></canvas>';
      html += '<div class="legend-labels"><span>-15% Decline</span><span>0%</span><span>+32% Growth</span></div>';
    } else if (currentLayer === "pay") {
      html += '<canvas id="legend-bar" width="220" height="14" class="legend-bar"></canvas>';
      html += '<div class="legend-labels"><span>\u20B95,000</span><span>\u20B925,000</span><span>\u20B980,000</span></div>';
    } else if (currentLayer === "skill") {
      html += '<div class="legend-discrete">';
      html += '<div class="legend-discrete-item"><div class="legend-swatch" style="background:#bbdefb;"></div>1 \u2013 Elementary</div>';
      html += '<div class="legend-discrete-item"><div class="legend-swatch" style="background:#64b5f6;"></div>2 \u2013 Semi-skilled</div>';
      html += '<div class="legend-discrete-item"><div class="legend-swatch" style="background:#7e57c2;"></div>3 \u2013 Skilled</div>';
      html += '<div class="legend-discrete-item"><div class="legend-swatch" style="background:#4a148c;"></div>4 \u2013 Highly skilled</div>';
      html += '</div>';
    } else if (currentLayer === "demand") {
      html += '<canvas id="legend-bar" width="220" height="14" class="legend-bar"></canvas>';
      html += '<div class="legend-labels"><span>Low (0)</span><span>High (100)</span></div>';
    } else if (currentLayer === "ai") {
      html += '<canvas id="legend-bar" width="220" height="14" class="legend-bar"></canvas>';
      html += '<div class="legend-labels"><span>0 (Safe)</span><span>5</span><span>10 (High)</span></div>';
    }

    html += '<div class="legend-source">';
    html += 'Employment: PLFS 2023-24<br>';
    html += 'Pay: PLFS survey average<br>';
    html += 'Demand: NCS portal-derived proxy<br>';
    html += 'AI Exposure: LLM-scored estimate';
    html += '</div>';
    html += '</div>'; // end legend-body

    legendEl.innerHTML = html;

    if (legendCollapsed) legendEl.classList.add("collapsed");
    else legendEl.classList.remove("collapsed");

    document.getElementById("legend-toggle").addEventListener("click", function() {
      legendCollapsed = !legendCollapsed;
      legendEl.classList.toggle("collapsed");
    });

    // Draw gradient bar
    var canvas = document.getElementById("legend-bar");
    if (canvas) {
      var ctx = canvas.getContext("2d");
      var w = canvas.width;
      for (var i = 0; i < w; i++) {
        var t = i / (w - 1);
        var color;
        if (currentLayer === "outlook") {
          color = d3.interpolateRdYlGn(t);
        } else if (currentLayer === "pay") {
          color = d3.interpolateRdYlGn(t);
        } else if (currentLayer === "demand") {
          color = d3.interpolateOrRd(t);
        } else if (currentLayer === "ai") {
          color = d3.interpolateRdYlGn(1 - t);
        }
        ctx.fillStyle = color;
        ctx.fillRect(i, 0, 1, 14);
      }
    }
  }

  // ─── Stats panel ───
  function updateStats() {
    if (!data || !data.length) return;

    // Total employment
    var totalEmp = d3.sum(data, function(d) { return d.employment_count || 0; });
    document.querySelector("#stat-total .stat-value").textContent = formatLakhCrore(totalEmp);

    // Layer-specific metric + contextual high/low counts
    var metricVal = "—";
    var metricLabel = "—";
    var highCount = 0, lowCount = 0, highLabel = "Growing", lowLabel = "Declining";
    var histField, histMin, histMax, histBins, histInterpolate, histReverse;

    if (currentLayer === "outlook") {
      var avgOutlook = d3.mean(data, function(d) { return d.growth_outlook; });
      metricVal = (avgOutlook > 0 ? "+" : "") + avgOutlook.toFixed(1) + "%";
      metricLabel = "Avg Outlook";
      highCount = data.filter(function(d) { return d.growth_outlook > 0; }).length;
      lowCount = data.filter(function(d) { return d.growth_outlook < 0; }).length;
      highLabel = "Growing"; lowLabel = "Declining";
      histField = "growth_outlook"; histMin = -15; histMax = 32; histBins = 12;
      histInterpolate = d3.interpolateRdYlGn; histReverse = false;
    } else if (currentLayer === "pay") {
      var medPay = d3.median(data.filter(function(d) { return d.pay_median_monthly != null; }), function(d) { return d.pay_median_monthly; });
      metricVal = formatCurrency(Math.round(medPay || 0));
      metricLabel = "Median Group Pay";
      highCount = data.filter(function(d) { return d.pay_median_monthly > medPay; }).length;
      lowCount = data.filter(function(d) { return d.pay_median_monthly != null && d.pay_median_monthly <= medPay; }).length;
      highLabel = "Above Median"; lowLabel = "At/Below";
      histField = "pay_median_monthly"; histMin = 5000; histMax = 55000; histBins = 12;
      histInterpolate = d3.interpolateRdYlGn; histReverse = false;
    } else if (currentLayer === "skill") {
      var avgSkill = d3.mean(data.filter(function(d) { return d.skill_level != null; }), function(d) { return d.skill_level; });
      metricVal = avgSkill ? avgSkill.toFixed(1) : "N/A";
      metricLabel = "Avg Skill Level";
      highCount = data.filter(function(d) { return d.skill_level >= 3; }).length;
      lowCount = data.filter(function(d) { return d.skill_level != null && d.skill_level < 3; }).length;
      highLabel = "High Skill (3-4)"; lowLabel = "Low Skill (1-2)";
      histField = "skill_level"; histMin = 0.5; histMax = 4.5; histBins = 4;
      histInterpolate = null; histReverse = false;
    } else if (currentLayer === "demand") {
      var avgDemand = d3.mean(data.filter(function(d) { return d.demand_index != null; }), function(d) { return d.demand_index; });
      metricVal = avgDemand ? avgDemand.toFixed(0) + "/100" : "N/A";
      metricLabel = "Avg Demand";
      highCount = data.filter(function(d) { return d.demand_index >= 50; }).length;
      lowCount = data.filter(function(d) { return d.demand_index != null && d.demand_index < 50; }).length;
      highLabel = "High Demand"; lowLabel = "Low Demand";
      histField = "demand_index"; histMin = 0; histMax = 100; histBins = 10;
      histInterpolate = d3.interpolateOrRd; histReverse = false;
    } else if (currentLayer === "ai") {
      var avgAI = d3.mean(data.filter(function(d) { return d.ai_exposure != null; }), function(d) { return d.ai_exposure; });
      metricVal = avgAI ? avgAI.toFixed(1) + "/10" : "N/A";
      metricLabel = "Avg AI Exposure";
      highCount = data.filter(function(d) { return d.ai_exposure >= 5; }).length;
      lowCount = data.filter(function(d) { return d.ai_exposure != null && d.ai_exposure < 5; }).length;
      highLabel = "High Exposure"; lowLabel = "Low Exposure";
      histField = "ai_exposure"; histMin = 0; histMax = 10; histBins = 10;
      histInterpolate = d3.interpolateRdYlGn; histReverse = true;
    }

    document.querySelector("#stat-growing .stat-value").textContent = highCount;
    document.querySelector("#stat-growing .stat-label").textContent = highLabel;
    document.querySelector("#stat-declining .stat-value").textContent = lowCount;
    document.querySelector("#stat-declining .stat-label").textContent = lowLabel;

    document.querySelector("#stat-metric .stat-value").textContent = metricVal;
    document.querySelector("#stat-metric .stat-label").textContent = metricLabel;

    // Build histogram
    var histEl = document.getElementById("stats-histogram");
    histEl.innerHTML = "";

    var filtered = data.filter(function(d) { return d[histField] != null; });
    if (!filtered.length) return;

    var binWidth = (histMax - histMin) / histBins;
    var bins = [];
    for (var i = 0; i < histBins; i++) {
      bins.push({ min: histMin + i * binWidth, max: histMin + (i + 1) * binWidth, count: 0, emp: 0 });
    }

    filtered.forEach(function(d) {
      var val = d[histField];
      var idx = Math.floor((val - histMin) / binWidth);
      idx = Math.max(0, Math.min(histBins - 1, idx));
      bins[idx].count++;
      bins[idx].emp += (d.employment_count || 0);
    });

    var maxEmp = d3.max(bins, function(b) { return b.emp; }) || 1;

    bins.forEach(function(bin, i) {
      var bar = document.createElement("div");
      bar.className = "hist-bar";
      var pct = Math.max(2, (bin.emp / maxEmp) * 100);
      bar.style.height = pct + "%";

      // Color the bar using the layer's interpolation
      var t = (i + 0.5) / histBins;
      if (histInterpolate) {
        bar.style.background = histInterpolate(histReverse ? 1 - t : t);
      } else {
        // Skill level: discrete colors
        var skillColors = ["#bbdefb", "#64b5f6", "#7e57c2", "#4a148c"];
        bar.style.background = skillColors[i] || "#666";
      }

      bar.title = bin.count + " occupations, " + formatLakhCrore(bin.emp) + " workers";
      histEl.appendChild(bar);
    });
  }

  // ─── Layer buttons ───
  document.querySelectorAll(".layer-btn").forEach(function(btn) {
    btn.addEventListener("click", function() {
      document.querySelectorAll(".layer-btn").forEach(function(b) { b.classList.remove("active"); });
      btn.classList.add("active");
      currentLayer = btn.getAttribute("data-layer");
      if (root) {
        var rect = treemapEl.getBoundingClientRect();
        render(rect.width, rect.height);
      }
      renderLegend();
      updateStats();
    });
  });

  // ─── Resize ───
  var resizeTimer;
  window.addEventListener("resize", function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      if (data) buildTreemap();
    }, 150);
  });

})();
</script>
</body>
</html>
